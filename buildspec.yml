version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 441384477513.dkr.ecr.ap-southeast-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t llm-aws-app .
      - docker tag llm-aws-app:latest 441384477513.dkr.ecr.ap-southeast-1.amazonaws.com/llm-aws-repo:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 441384477513.dkr.ecr.ap-southeast-1.amazonaws.com/llm-aws-repo:latest
      - echo Writing image definitions file...
      - printf '{"ImageURI":"441384477513.dkr.ecr.ap-southeast-1.amazonaws.com/llm-aws-repo:latest"}' > imageDetail.json
artifacts:
  files: imageDetail.json